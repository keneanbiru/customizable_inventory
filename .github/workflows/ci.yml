name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hasu_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hasu_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hasu_test
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Migrate & test
        run: |
          npm run db:migrate -w server
          npm run test
      - name: Build server
        run: npm run build -w server
      - name: Build client
        run: npm run build -w client
